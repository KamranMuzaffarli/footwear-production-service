name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/footwear_production_ci
      TEST_DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/footwear_production_test
      LOG_LEVEL: INFO
      PGPASSWORD: postgres

    services:
      postgres:
        image: postgres:18.3
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: footwear_production_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d footwear_production_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout backend
        uses: actions/checkout@v7

      - name: Checkout FootwearProductionCore
        uses: actions/checkout@v7
        with:
          repository: KamranMuzaffarli/footwear-production-core
          ref: 3f326652b9290af92292e6a0e9d25c6245afe5d3
          path: FootwearProductionCore

      - name: Create test database
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d footwear_production_ci \
            -v ON_ERROR_STOP=1 \
            -c "CREATE DATABASE footwear_production_test;"

      - name: Initialize test database
        run: |
          psql \
            -h localhost \
            -U postgres \
            -d footwear_production_test \
            -v ON_ERROR_STOP=1 \
            -f FootwearProductionCore/database/ddl/01_reference_tables.sql

          psql \
            -h localhost \
            -U postgres \
            -d footwear_production_test \
            -v ON_ERROR_STOP=1 \
            -f FootwearProductionCore/database/schema_migrations/001_update_shoe_models_classification_fields.sql

          psql \
            -h localhost \
            -U postgres \
            -d footwear_production_test \
            -v ON_ERROR_STOP=1 \
            -f FootwearProductionCore/database/data_migrations/001_add_padding_material_category.sql

          psql \
            -h localhost \
            -U postgres \
            -d footwear_production_test \
            -v ON_ERROR_STOP=1 \
            -f FootwearProductionCore/database/dml/01_seed_data.sql

      - name: Verify database initialization
        run: |
          shoe_lasts_count="$(
            psql \
              -h localhost \
              -U postgres \
              -d footwear_production_test \
              -At \
              -c "SELECT COUNT(*) FROM public.shoe_lasts;"
          )"

          echo "shoe_lasts count: ${shoe_lasts_count}"
          test "${shoe_lasts_count}" -gt 0

          psql \
            -h localhost \
            -U postgres \
            -d footwear_production_test \
            -At \
            -c "SELECT to_regclass('public.shoe_models') IS NOT NULL;" \
            | grep -qx "t"

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install project
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[test,dev]"

      - name: Ruff check
        run: ruff check app tests

      - name: Ruff format check
        run: ruff format --check app tests

      - name: Run tests
        run: pytest -v
